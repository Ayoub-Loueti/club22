<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réservation Details</title>
  <style>
    /* Add your CSS styles here */
    body {
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .reservation-details {
      margin-bottom: 30px;
    }

    .reservation-details h2 {
      margin-bottom: 10px;
    }

    .reservation-info {
      margin-bottom: 15px;
    }

    .room-info {
      margin-left: 20px;
    }

    .image-container {
      text-align: center;
      margin-top: 30px;
    }

    .image-container img {
      max-width: 100%;
      height: auto;
      border-radius: 5px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>Réservation Details</h1>
    </div>
    <div class="reservation-details">
      <div class="reservation-info">
        <h2>Nom du Collaborateur: John Doe</h2>
        <p>Titre de l'offre: Offre spéciale</p>
        <p>Destination: Paris, France</p>
        <p>Prix Total: 500 DT</p>
        <p>Type de Réservation: Hôtel</p>
      </div>
      <div class="room-info">
        <h3>Chambres:</h3>
        <p>Chambre 1: Adultes - 2, Enfants - 1, Prix - 200 DT</p>
        <p>Chambre 2: Adultes - 1, Enfants - 0, Prix - 100 DT</p>
      </div>
    </div>
    <div class="image-container">
      <img src="https://example.com/image1.jpg" alt="Image 1">
      <img src="https://example.com/image2.jpg" alt="Image 2">
    </div>
  </div>
</body>

</html>
